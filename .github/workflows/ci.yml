name: Go validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -coverprofile=coverage.out ./...
      - name: Build portable binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/llm-bench ./cmd/llm-bench
      - run: bin/llm-bench --version && bin/llm-bench --config examples/matrix.json --validate
      - uses: actions/upload-artifact@v4
        with:
          name: llm-bench-linux-amd64
          path: bin/llm-bench
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
